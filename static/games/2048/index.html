<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>2048 本地</title>
<style>
body { text-align:center; font-family:sans-serif }
button { padding:10px 20px; font-size:16px; }
</style>
</head>
<body>
<h2>🧩 2048 本地</h2>
<p>当前得分：<span id="score">0</span></p>
<button onclick="startGame()">开始游戏</button>
<div id="game-container" style="margin-top:10px;"></div>
<script>
function startGame() {
  const container = document.getElementById("game-container");
  container.innerHTML = `<iframe src="2048_game.html" width="100%" height="500" frameborder="0"></iframe>`;
}
</script>
</body>
</html>
