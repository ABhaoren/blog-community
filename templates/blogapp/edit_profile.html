{% extends 'blogapp/base.html' %}
{% block title %}修改个人信息{% endblock %}

{% block content %}
<h3>修改个人信息</h3>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}

    <div class="mb-3">
        <label>用户名</label>
        {{ user_form.username }}
    </div>

    <div class="mb-3">
        <label>昵称</label>
        {{ user_form.first_name }}
    </div>

    <div class="mb-3">
        <label>性别</label>
        {{ profile_form.gender }}
    </div>

    <div class="mb-3">
        <label>生日</label>
        {{ profile_form.birthday }}
    </div>

    <div class="mb-3">
        <label>头像</label><br>
        <!-- 当前头像 -->
        <img id="avatar-preview" src="{{ request.user.userprofile.avatar.url }}" width="100" height="100" class="rounded-circle mb-2" alt="当前头像"><br>
        {{ profile_form.avatar }}
    </div>
    
    <div class="mb-3">
        <label>个性签名</label>
        {{ profile_form.signature }}
    </div>


    <button type="submit" class="btn btn-primary">保存修改</button>
</form>

<!-- 图片预览脚本 -->
<script>
document.addEventListener('DOMContentLoaded', function () {
    const avatarInput = document.querySelector('input[name="avatar"]');
    const preview = document.getElementById('avatar-preview');

    avatarInput.addEventListener('change', function () {
        const file = avatarInput.files[0];
        if (file) {
            preview.src = URL.createObjectURL(file);
        }
    });
});
</script>
{% endblock %}
