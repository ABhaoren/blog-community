{% extends 'blogapp/base.html' %}
{% load static %}

{% block title %}发布文章{% endblock %}
{% block content %}
<head>
    {{ form.media }}
    <meta charset="UTF-8" />
    <title>{% if mode == 'edit' %}编辑文章{% else %}新建文章{% endif %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
<div class="container mt-4">
    <h2>{% if mode == 'edit' %}编辑文章{% else %}新建文章{% endif %}</h2>
    <form method="post" enctype="multipart/form-data" novalidate>
        {% csrf_token %}

        <div class="mb-3">
            <label for="title" class="form-label">标题</label>
            <input type="text" id="title" name="title" class="form-control"
                   value="{{ article.title|default_if_none:'' }}" required />
        </div>

        <div class="mb-3">
            <label for="content" class="form-label">内容</label>
        </div>
            
         <div class="mb-3">
            {{ form.content }}
        </div>


        <div class="mb-3">
            <label for="file" class="form-label">上传附件（可多选）</label>
            <input type="file" name="file" multiple class="form-control" />
        </div>

        <div class="mb-3">
            <label for="category_select" class="form-label">选择已有分类</label>
            <select id="category_select" name="category_select" class="form-select">
                <option value="">-- 请选择分类 --</option>
                {% for c in categories %}
                    <option value="{{ c.name }}"
                        {% if article and article.category and article.category.name == c.name %}selected{% endif %}>
                        {{ c.name }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-3">
            <label for="category_new" class="form-label">或输入新分类</label>
            <input type="text" id="category_new" name="category_new" class="form-control" placeholder="输入新分类名称" />
        </div>

        <div class="mb-3">
            <label for="tags" class="form-label">标签（用逗号分隔，支持自定义）</label>
            <input type="text" id="tags" name="tags" class="form-control"
                   value="{% if article and article.id %}{{ article.tags.all|join:', ' }}{% endif %}" placeholder="如：标签1, 标签2, 测试标签" />
        </div>

        <button type="submit" class="btn btn-primary">{% if mode == 'edit' %}保存修改{% else %}发布文章{% endif %}</button>
        <a href="{% url 'article_list' %}" class="btn btn-secondary ms-2">取消</a>
    </form>
</div>
</body>
{% endblock %}
