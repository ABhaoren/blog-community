{% extends 'blogapp/base.html' %}
{% block title %}编辑帖子{% endblock %}
{% block content %}
<h2>📝 编辑讨论帖</h2>
<form method="post">{% csrf_token %}
  {{ form.as_p }}
  <button class="btn btn-success">保存修改</button>
  <a href="{% url 'forum_detail' form.instance.id %}" class="btn btn-secondary">取消</a>
</form>
{% endblock %}
