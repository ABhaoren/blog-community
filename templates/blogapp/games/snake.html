{% extends 'blogapp/base.html' %}
{% load static %}
{% block content %}

<div class="controls text-center">
  <label>速度 (毫秒/帧): <input type="number" id="speed" value="100" min="50" max="500"></label>
  <button onclick="startGame()">开始游戏</button>
</div>
<div class="score text-center">当前得分：<span id="score">0</span></div>
<canvas id="game" width="400" height="400" style="display:block; margin:auto; background:#000;"></canvas>

<!-- 🔽 添加排行榜容器 -->
<div id="leaderboard" style="max-width:400px;margin:auto;margin-top:20px;"></div>

<script>
let canvas = document.getElementById("game"),
    ctx = canvas.getContext("2d"),
    box = 20,
    snake = [],
    dir = "RIGHT",
    food,
    game,
    score = 0;

function resetGame() {
  snake = [{x: 9*box, y: 10*box}];
  dir = "RIGHT";
  score = 0;
  document.getElementById("score").textContent = score;
  food = {
    x: Math.floor(Math.random() * 19 + 1) * box,
    y: Math.floor(Math.random() * 19 + 1) * box
  };
}

function draw() {
  ctx.fillStyle = "black";
  ctx.fillRect(0, 0, 400, 400);
  for (let i = 0; i < snake.length; i++) {
    ctx.fillStyle = i === 0 ? "lime" : "white";
    ctx.fillRect(snake[i].x, snake[i].y, box, box);
  }
  ctx.fillStyle = "red";
  ctx.fillRect(food.x, food.y, box, box);
  let headX = snake[0].x, headY = snake[0].y;
  if (dir === "LEFT") headX -= box;
  if (dir === "RIGHT") headX += box;
  if (dir === "UP") headY -= box;
  if (dir === "DOWN") headY += box;
  if (headX === food.x && headY === food.y) {
    score += 10;
    document.getElementById("score").textContent = score;
    food = { x: Math.floor(Math.random() * 19 + 1) * box, y: Math.floor(Math.random() * 19 + 1) * box };
  } else {
    snake.pop();
  }
  let newHead = {x: headX, y: headY};
  if (headX < 0 || headX >= 400 || headY < 0 || headY >= 400 || collision(newHead, snake)) {
    clearInterval(game);
    alert("游戏结束！得分：" + score);
    submitScore(score);
  }
  snake.unshift(newHead);
}

function collision(head, array) {
  for (let i = 0; i < array.length; i++) {
    if (head.x === array[i].x && head.y === array[i].y) return true;
  }
  return false;
}

function startGame() {
  clearInterval(game);
  resetGame();
  let speed = parseInt(document.getElementById("speed").value);
  game = setInterval(draw, speed);
}

document.addEventListener("keydown", e => {
  e.preventDefault();  // 阻止页面滚动
  if (e.keyCode == 37 && dir !== "RIGHT") dir = "LEFT";
  else if (e.keyCode == 38 && dir !== "DOWN") dir = "UP";
  else if (e.keyCode == 39 && dir !== "LEFT") dir = "RIGHT";
  else if (e.keyCode == 40 && dir !== "UP") dir = "DOWN";
});

function submitScore(score) {
  fetch("/api/game/submit_score/", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({game: "snake", score: score})
  }).then(() => loadLeaderboard());
}

function loadLeaderboard() {
  fetch("/games/snake/leaderboard/")
    .then(res => res.text())
    .then(html => {
      document.getElementById("leaderboard").innerHTML = html;
    });
}

window.onload = loadLeaderboard;
</script>

{% endblock %}
