
{% extends 'blogapp/base.html' %}
{% load static %}
{% block content %}
<h4>🐍 贪吃蛇</h4>
<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>贪吃蛇 - 计分+重启</title>
  <style>
    canvas { background: #000; display: block; margin: auto; }
    .controls { text-align: center; margin: 10px; }
    .controls button, .controls input { font-size: 16px; margin: 5px; }
    .score { text-align: center; font-size: 20px; margin-top: 5px; }
  </style>
</head>
<body>
<div class="controls">
  <label>速度 (毫秒/帧): <input type="number" id="speed" value="100" min="50" max="500"></label>
  <button onclick="startGame()">重新开始</button>
</div>
<div class="score">当前得分：<span id="score">0</span></div>
<canvas id="game" width="400" height="400"></canvas>
<script>
let canvas = document.getElementById("game"),
    ctx = canvas.getContext("2d"),
    box = 20,
    snake = [],
    dir = "RIGHT",
    food,
    game,
    score = 0;

function resetGame() {
  snake = [{x: 9*box, y: 10*box}];
  dir = "RIGHT";
  score = 0;
  document.getElementById("score").textContent = score;
  food = {
    x: Math.floor(Math.random() * 19 + 1) * box,
    y: Math.floor(Math.random() * 19 + 1) * box
  };
}

function draw() {
  ctx.fillStyle = "black";
  ctx.fillRect(0, 0, 400, 400);

  for (let i = 0; i < snake.length; i++) {
    ctx.fillStyle = i === 0 ? "lime" : "white";
    ctx.fillRect(snake[i].x, snake[i].y, box, box);
  }

  ctx.fillStyle = "red";
  ctx.fillRect(food.x, food.y, box, box);

  let headX = snake[0].x;
  let headY = snake[0].y;

  if (dir === "LEFT") headX -= box;
  if (dir === "RIGHT") headX += box;
  if (dir === "UP") headY -= box;
  if (dir === "DOWN") headY += box;

  if (headX === food.x && headY === food.y) {
    score += 10;
    document.getElementById("score").textContent = score;
    food = {
      x: Math.floor(Math.random() * 19 + 1) * box,
      y: Math.floor(Math.random() * 19 + 1) * box
    };
  } else {
    snake.pop();
  }

  let newHead = {x: headX, y: headY};

  if (headX < 0 || headX >= 400 || headY < 0 || headY >= 400 || collision(newHead, snake)) {
    clearInterval(game);
    alert("游戏结束！得分：" + score);
  }

  snake.unshift(newHead);
}

function collision(head, array) {
  for (let i = 0; i < array.length; i++) {
    if (head.x === array[i].x && head.y === array[i].y) return true;
  }
  return false;
}

function startGame() {
  clearInterval(game);
  resetGame();
  let speed = parseInt(document.getElementById("speed").value);
  game = setInterval(draw, speed);
}

document.addEventListener("keydown", e => {
  if (e.keyCode == 37 && dir !== "RIGHT") dir = "LEFT";
  else if (e.keyCode == 38 && dir !== "DOWN") dir = "UP";
  else if (e.keyCode == 39 && dir !== "LEFT") dir = "RIGHT";
  else if (e.keyCode == 40 && dir !== "UP") dir = "DOWN";
});

resetGame();
startGame();
</script>
</body>
</html>

{% endblock %}
