{% load static %}
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #f9f9f9;
      font-family: sans-serif;
    }
    .player {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 5px 10px;
    }
    button {
      background: none;
      border: none;
      font-size: 18px;
      cursor: pointer;
    }
    input[type=range] {
      width: 80px;
    }
  </style>
</head>
<body>
  <div class="player">
    <button id="playPause">⏸️</button>
    <button id="next">⏭️</button>
    <input id="volume" type="range" min="0" max="1" step="0.05">
  </div>
  <audio id="audio" autoplay></audio>

  <script>
    const playlist = [
      "{% static 'music/song1.mp3' %}",
      "{% static 'music/song2.mp3' %}",
      "{% static 'music/song3.mp3' %}"
    ];
    const audio = document.getElementById('audio');
    const playPauseBtn = document.getElementById('playPause');
    const nextBtn = document.getElementById('next');
    const volumeSlider = document.getElementById('volume');

    let index = parseInt(localStorage.getItem('music_index') || 0);
    let isPlaying = true;

    function loadSong(i) {
      index = i % playlist.length;
      audio.src = playlist[index];
      localStorage.setItem('music_index', index);
      audio.play().catch(() => {}); // 防止自动播放失败
    }

    playPauseBtn.onclick = () => {
      if (audio.paused) {
        audio.play();
        isPlaying = true;
        playPauseBtn.textContent = "⏸️";
      } else {
        audio.pause();
        isPlaying = false;
        playPauseBtn.textContent = "▶️";
      }
    };

    nextBtn.onclick = () => {
      loadSong(index + 1);
    };

    volumeSlider.oninput = () => {
      audio.volume = volumeSlider.value;
      localStorage.setItem('music_volume', audio.volume);
    };

    audio.onended = () => nextBtn.click();

    // 初始化播放设置
    window.addEventListener('load', () => {
      const savedVolume = localStorage.getItem('music_volume');
      audio.volume = savedVolume !== null ? parseFloat(savedVolume) : 0.5;
      volumeSlider.value = audio.volume;
      loadSong(index);
    });

    // 添加首次交互触发播放
    document.addEventListener("click", () => {
      if (audio.paused) {
        audio.play().then(() => {
          playPauseBtn.textContent = "⏸️";
        }).catch(err => {
          console.warn("播放失败：", err);
        });
      }
    }, { once: true });
  </script>
</body>
</html>
